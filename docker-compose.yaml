  #   ports:
  #     - 6379:6379
  #   environment:
  #     - ALLOW_EMPTY_PASSWORD=yes
  #   networks:
  #     - articles-network



volumes:
  postgres_data: 
  rabbitmq_data:

networks:
  board-network:
  
          